<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Rounded square badge -->
  <rect x="20" y="20" width="200" height="200" rx="46" fill="#EAF2FF"/>
  <rect x="20" y="20" width="200" height="200" rx="46" fill="none" stroke="#3157D5" stroke-width="4"/>

  <!-- Monogram: M and S combined, with a small phone-notch accent -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="120" y="150" font-size="108" text-anchor="middle" fill="#111827">M</text>
    <text x="120" y="150" font-size="108" text-anchor="middle" fill="#3157D5" opacity="0.85" dx="34" dy="0">S</text>
  </g>

  <!-- Small phone icon accent, bottom center -->
  <rect x="104" y="172" width="32" height="18" rx="4" fill="none" stroke="#3157D5" stroke-width="3"/>
  <circle cx="120" cy="181" r="1.6" fill="#3157D5"/>
</svg>

{% extends "admin_base.html" %} {% block content %}
<main>
  <h2>Admin - Manage Products</h2>
  <table>
    <tr>
      <th>Name</th>
      <th>Brand</th>
      <th>Price</th>
      <th>Action</th>
    </tr>
    {% for product in products %}
    <tr>
      <td>{{ product.name }}</td>
      <td>{{ product.brand }}</td>
      <td>{{ product.price }}</td>
      <td>
        <a href="{{ url_for('edit_product_form', product_id=product.id) }}"
          >Edit</a
        >
        <form
          action="{{ url_for('delete_product', product_id=product.id) }}"
          method="POST"
        >
          <button type="submit">Delete</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </table>
</main>
{% endblock %}

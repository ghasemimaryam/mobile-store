{% extends "base.html" %} {% block content %}
<main>
  <h2>My Wishlist</h2>
  {% for item in items %}
  <div class="cart-item">
    <h3>{{ item.name }}</h3>
    <p>Price: {{ item.price }} Toman</p>
    <form
      action="{{ url_for('toggle_wishlist', product_id=item.id) }}"
      method="POST"
    >
      <button type="submit" class="btn">Remove from Wishlist</button>
    </form>
  </div>
  {% endfor %}
</main>
{% endblock %}

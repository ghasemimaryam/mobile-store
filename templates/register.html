{% extends "auth_base.html" %} {% block title %}Register - MobileStore{%
endblock %} {% block content %}
<div class="auth-form-container">
  <div class="auth-header">
    <h2>Create Account</h2>
    <p>Sign up to start shopping for the best devices.</p>
  </div>

  {% if error %}
  <p style="color: red; margin-bottom: 16px">{{ error }}</p>
  {% endif %}

  <form method="POST" class="auth-form">
    <div class="input-group">
      <label>Full Name</label>
      <div class="input-wrapper">
        <i class="bi bi-person"></i>
        <input type="text" name="name" placeholder="John Doe" required />
      </div>
    </div>

    <div class="input-group">
      <label>Email Address</label>
      <div class="input-wrapper">
        <i class="bi bi-envelope"></i>
        <input
          type="email"
          name="email"
          placeholder="name@example.com"
          required
        />
      </div>
    </div>

    <div class="input-group">
      <label>Password</label>
      <div class="input-wrapper">
        <i class="bi bi-lock"></i>
        <input
          type="password"
          name="password"
          placeholder="Enter your password"
          required
        />
      </div>
    </div>

    <button type="submit" class="btn auth-btn">Register</button>
  </form>

  <p class="auth-switch">
    Already have an account? <a href="{{ url_for('login') }}">Login</a>
  </p>
</div>
{% endblock %}

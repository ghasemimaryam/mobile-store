{% extends "base.html" %} {% block content %}
<main>
  <h2>Your Cart</h2>
  {% for item in items %}
  <div class="cart-item">
    <h3>{{ item.name }}</h3>
    <form
      action="{{ url_for('update_cart', cart_item_id=item.cart_item_id, action='decrease') }}"
      method="POST"
      style="display: inline"
    >
      <button type="submit">-</button>
    </form>
    <span>{{ item.quantity }}</span>
    <form
      action="{{ url_for('update_cart', cart_item_id=item.cart_item_id, action='increase') }}"
      method="POST"
      style="display: inline"
    >
      <button type="submit">+</button>
    </form>
    <p>Price: {{ item.price }} Toman</p>
  </div>
  {% endfor %}
  <p>Total: {{ total }} Toman</p>
  <a href="{{ url_for('checkout') }}" class="btn">Go to Checkout</a>
</main>
{% endblock %}

{% extends "base.html" %} {% block content %}
<main>
  <h2>Checkout</h2>
  {% for item in items %}
  <div class="cart-item">
    <h3>{{ item.name }}</h3>
    <p>Quantity: {{ item.quantity }}</p>
    <p>Price: {{ item.price }} Toman</p>
  </div>
  {% endfor %}
  <p>Total: {{ total }} Toman</p>

  <form action="{{ url_for('confirm_order') }}" method="POST">
    <button type="submit" class="btn">Confirm Order</button>
  </form>
</main>
{% endblock %}
